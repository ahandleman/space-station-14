environments:
- id: habitable
  description: Sealed ordinary crew atmosphere.
  pressure: standard
  enclosure: sealed
  temperature: ambient
- id: vacuum
  description: Open vacuum with supported lattice/catwalk floor where machinery or crew routes require
    it.
  pressure: vacuum
  enclosure: open
  temperature: cold
- id: hot_process
  description: Sealed hazardous combustion/process gas; outside the habitable hull. No breathable-atmosphere
    assumption.
  pressure: process
  enclosure: sealed
  temperature: hot
- id: custom_process
  description: Explicit special process space; gas composition and operating controls require a later
    machinery implementation.
  pressure: process
  enclosure: sealed
  temperature: custom
- id: cold_storage
  description: Sealed pressurized cold storage; thermal bounds and maintained cooling are specified on
    the local room requirement.
  pressure: standard
  enclosure: sealed
  temperature: cold
grids:
- id: station
  description: Primary engine grid. Outboard supported regions can remain on this grid even across vacuum.
  kind: station
  support: mixed
- id: visiting_shuttle
  description: Reserved external docking counterpart, not room floor owned by this program.
  kind: detached
  support: solid
domains:
- id: exterior_space
  description: Vacuum connected to unbounded exterior; an enclosed courtyard is insufficient.
  kind: vacuum
  connectedToExterior: true
- id: vacuum_courtyard
  description: Sealed-from-exterior vacuum pocket, usable for a window but not a shuttle approach.
  kind: vacuum
  connectedToExterior: false
