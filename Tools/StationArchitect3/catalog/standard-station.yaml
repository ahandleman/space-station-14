assemblies:
- id: furniture_table_pair_native
  description: One wooden table with opposing adjacent seats facing its center; mapped Box dining pose.
  parts:
  - id: table
    prototypes: [TableWood]
    x: 0
    y: 0
    rotation: 0
  - id: north_seat
    prototypes: [ChairWood]
    x: 0
    y: 1
    rotation: 0
  - id: south_seat
    prototypes: [ChairWood]
    x: 0
    y: -1
    rotation: 180
