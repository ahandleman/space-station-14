extensions:
- id: x_teg_operating_conditions
  appliesTo: node
  description: Required thermal realization contract. A later evaluator resolves local feature/port names
    and proves working gas, separate loops, positive inlet pressure drop, startup power and useful temperature
    difference. Authoring validation is not that proof.
  evaluator: ss14.thermal.teg-operating-conditions/v1
  parametersSchema:
    type: object
    additionalProperties: false
    required:
    - assemblyFeature
    - flowDrivers
    - startupPowerPort
    - requireWorkingGas
    - requirePositivePressureDrop
    - minimumTemperatureDifferenceKExclusive
    - preferredTemperatureDifferenceK
    - isolateCircuits
    properties:
      assemblyFeature:
        type: string
        minLength: 1
      flowDrivers:
        type: array
        minItems: 2
        uniqueItems: true
        items:
          type: string
          minLength: 1
      startupPowerPort:
        type: string
        minLength: 1
      requireWorkingGas:
        const: true
      requirePositivePressureDrop:
        const: true
      minimumTemperatureDifferenceKExclusive:
        type: number
        minimum: 0
      preferredTemperatureDifferenceK:
        type: number
        exclusiveMinimum: 0
      isolateCircuits:
        const: true
- id: x_feature_exposure
  appliesTo: node
  description: Required per-instance exposure contract. Vacuum requires unblocked heat exchange cells
    and an exterior path; sunlight checks potential unobstructed rays at sample directions, not constant
    night-time output. A later native evaluator resolves local feature IDs and actual exposure.
  evaluator: ss14.environment.feature-exposure/v1
  parametersSchema:
    type: object
    additionalProperties: false
    required:
    - featureIds
    - medium
    - allInstances
    - unblocked
    - sampleDirections
    - rangeTiles
    - minimumClearDirections
    properties:
      featureIds:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      medium:
        enum:
        - vacuum
        - sunlight
      allInstances:
        const: true
      unblocked:
        const: true
      sampleDirections:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum:
          - north
          - east
          - south
          - west
      rangeTiles:
        type: integer
        minimum: 1
      minimumClearDirections:
        type: integer
        minimum: 1
        maximum: 4
- id: x_device_binding
  appliesTo: relationship
  description: Persist an explicit native source/sink binding between the selected local machine instances.
    One-to-one behavior and native operating power must be checked later; proximity is not a binding.
  evaluator: ss14.local.device-binding/v1
  parametersSchema:
    type: object
    additionalProperties: false
    required:
    - sourceComponent
    - sourcePort
    - targetComponent
    - targetPort
    - oneToOne
    - persistBinding
    - requirePoweredEndpoints
    properties:
      sourceComponent:
        type: string
        minLength: 1
      sourcePort:
        type: string
        minLength: 1
      targetComponent:
        type: string
        minLength: 1
      targetPort:
        type: string
        minLength: 1
      oneToOne:
        const: true
      persistBinding:
        const: true
      requirePoweredEndpoints:
        const: true
- id: x_device_link_reach
  appliesTo: relationship
  description: 'A local repairability preference: placement permits creating the link under the selected
    source range. Saved native bindings may restore outside that range; this is not a runtime disconnection
    rule.'
  evaluator: ss14.local.device-link-reach/v1
  parametersSchema:
    type: object
    additionalProperties: false
    required:
    - bindingRelationship
    - rangeSourceComponent
    - rangeSourceField
    - distanceMetric
    properties:
      bindingRelationship:
        type: string
        minLength: 1
      rangeSourceComponent:
        type: string
        minLength: 1
      rangeSourceField:
        type: string
        minLength: 1
      distanceMetric:
        const: native_map_distance
- id: x_research_association
  appliesTo: relationship
  description: Local research consumer obligation. Resolve an eligible server on the same native grid
    and register the client with it. This is software association, not a cable or room adjacency. Power
    is a separate operational prerequisite; no global network is synthesized by this definition.
  evaluator: ss14.local.research-association/v1
  parametersSchema:
    type: object
    additionalProperties: false
    required:
    - clientComponent
    - serverComponent
    - sameGrid
    - requireRegistration
    - requireOperationalServer
    properties:
      clientComponent:
        const: ResearchClient
      serverComponent:
        const: ResearchServer
      sameGrid:
        const: true
      requireRegistration:
        const: true
      requireOperationalServer:
        const: true
- id: x_airlock_cycle
  appliesTo: node
  description: Local two-gate realization. The named feature instances realize the inner shared boundary
    and outer perimeter rather than duplicating those doors. Later evaluate interlocks, safe pressure
    cycling and suited exterior egress.
  evaluator: ss14.local.airlock-cycle/v1
  parametersSchema:
    type: object
    additionalProperties: false
    required:
    - innerFeature
    - outerFeature
    - preventSimultaneousOpening
    - requirePressureCycle
    - exteriorDomain
    - requireSuitedEgress
    properties:
      innerFeature:
        type: string
        minLength: 1
      outerFeature:
        type: string
        minLength: 1
      preventSimultaneousOpening:
        const: true
      requirePressureCycle:
        const: true
      exteriorDomain:
        type: string
        minLength: 1
      requireSuitedEgress:
        const: true
- id: x_salvage_deployment
  appliesTo: node
  description: 'Local magnet footprint obligation exposed to future placement: use the selected native
    debris pool and magnet orientation, test rotated grid bounds and preserve viable exterior placements.
    No global packing or reservations are computed here; the future algorithm propagates conflicts with
    other local footprints.'
  evaluator: ss14.local.salvage-deployment/v1
  parametersSchema:
    type: object
    additionalProperties: false
    required:
    - featureId
    - debrisSet
    - useNativePlacementSearch
    - accountForRotation
    - rejectGridIntersection
    - preserveLocalClearance
    properties:
      featureId:
        type: string
