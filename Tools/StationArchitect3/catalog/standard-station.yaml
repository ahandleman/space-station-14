# Independent V3 architecture: requirements and relationships are declared locally.
# See ../FORMAT.md for relative references, binding and evaluator semantics.
format: ss14-station-architect
schemaVersion: 3
id: standard_station
name: Standard station relationship program
description: 'Independent third architecture: declarative nested spaces and typed physical/functional
  requirements. No staged-edit state. Mandatory rules are feasibility obligations; weights never waive
  them.'
