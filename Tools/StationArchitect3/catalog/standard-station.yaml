  - comparative_furnishing_box_6680
- id: teg_native
  description: 'Canonical native local pose: degrees counterclockwise from engine south. Hot/cold labels
    describe this authored circuit assignment, not a native fixed hot side.'
  parts:
  - id: center
    prototypes:
    - TegCenter
    x: 0
    y: 0
    rotation: 90
  - id: hot
    prototypes:
    - TegCirculator
    x: -1
    y: 0
    rotation: 180
  - id: cold
    prototypes:
    - TegCirculator
    x: 1
    y: 0
    rotation: 0
  ports:
  - id: hot_in
    part: hot
    nativeNode: inlet
    system: gas
    medium: hot_loop
    direction: in
  - id: hot_out
    part: hot
    nativeNode: outlet
    system: gas
    medium: hot_loop
    direction: out
  - id: cold_in
    part: cold
    nativeNode: inlet
    system: gas
    medium: cold_loop
    direction: in
  - id: cold_out
    part: cold
    nativeNode: outlet
    system: gas
    medium: cold_loop
    direction: out
  - id: generation
    part: center
    nativeNode: output
    system: power
    medium: HVPower
    direction: out
  - id: startup_power
    part: center
    nativeComponent: ApcPowerReceiver
    system: power
    medium: Apc
    direction: in
  sameGrid: true
  evidence:
  - content_server_power_generation_teg_tegnodegroup_cs
  - box_4052
- id: substation_native
  description: Native HV-to-MV converter; input and output are distinct native nodes, not SMES storage.
  parts:
  - id: device
    prototypes:
    - SubstationBasic
    x: 0
    y: 0
    rotation: 0
  ports:
  - id: hv_in
    part: device
    system: power
    medium: HVPower
    direction: in
    nativeNode: input
  - id: mv_out
    part: device
    system: power
    medium: MVPower
    direction: out
    nativeNode: output
  sameGrid: true
  evidence:
  - native_substation_hv_mv
- id: apc_native
  description: Realization template for evaluator-placed APCs. Native local coverage and network capacity
    determine placement/count; this definition spawns nothing by itself.
  parts:
  - id: device
    prototypes:
    - APCBasic
    x: 0
    y: 0
    rotation: 0
  ports:
  - id: mv_in
    part: device
    system: power
    medium: MVPower
    direction: in
    nativeNode: input
  - id: lv_out
    part: device
    system: power
    medium: Apc
    direction: out
    nativeNode: output
  - id: coverage
    part: device
    system: power
    medium: Apc
    direction: out
    nativeComponent: ExtensionCableProvider
  sameGrid: true
  evidence:
  - native_apc_mv_lv
  - native_apc_receiver_coverage
- id: habitable_vent_native
  description: Ordinary habitable-zone supply vent. Requires a supplied pipe, operating settings, power
    and a real atmos control binding.
  parts:
  - id: device
    prototypes:
    - GasVentPump
    x: 0
    y: 0
    rotation: 0
  ports:
  - id: supply
    part: device
    system: gas
    medium: air_supply
    direction: in
    nativeNode: pipe
  - id: power
    part: device
    system: power
    medium: Apc
    direction: in
    nativeComponent: ApcPowerReceiver
  - id: controls
    part: device
    system: data
    medium: atmos_control
    direction: bidirectional
    nativeComponent: DeviceNetwork
  sameGrid: true
  evidence:
  - native_vent_operating_dependencies
- id: habitable_scrubber_native
  description: Ordinary habitable-zone waste extraction. A full or disconnected pipe stub does not satisfy
    the outlet obligation.
  parts:
  - id: device
    prototypes:
    - GasVentScrubber
    x: 0
    y: 0
    rotation: 0
  ports:
