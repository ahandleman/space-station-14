# Local serving relationships; repeat a suite without cross-binding its neighbors.
format: ss14-station-architect
schemaVersion: 3
defaults:
  requirement:
    priority: mandatory
    weight: 100
accessProfiles:
- id: public
  description: Planning actor credentials for public routes; interface access clauses remain explicit.
  levels:
  - public
  canTraverseVacuum: false
- id: hop
  description: Planning actor credentials for hop routes; interface access clauses remain explicit.
  levels:
  - public
  - HeadOfPersonnel
  - Command
  - Maintenance
  canTraverseVacuum: false
- id: kitchen
  description: Planning actor credentials for kitchen routes; interface access clauses remain explicit.
  levels:
  - public
  - Kitchen
  - Service
  - Maintenance
  canTraverseVacuum: false
- id: bar
  description: Planning actor credentials for bar routes; interface access clauses remain explicit.
  levels:
  - public
  - Bar
  - Service
  - Maintenance
  canTraverseVacuum: false
environments:
- id: habitable
  description: Sealed ordinary crew atmosphere.
  pressure: standard
  enclosure: sealed
  temperature: ambient
grids:
- id: station
  description: Primary engine grid. Outboard supported regions can remain on this grid even across vacuum.
  kind: station
  support: mixed
interfaces:
- id: service_counter
  description: Serving surface with working/customer approach floor on opposite sides. Does not fulfill
    a routine walking edge.
  capabilities:
  - item_transfer
  - speech
  - visibility
  construction:
  - TableCounterMetal
  normalState: open
  access:
    anyOf: []
  airtight: false
- id: hop_service_window
  description: HoP-controlled counter/windoor service border; items transfer during a controlled open
    cycle. Staff ingress is a separate edge.
  capabilities:
  - item_transfer
  - speech
  - visibility
  construction:
  - TableCounterMetal
  - WindoorHeadOfPersonnelLocked
  normalState: controlled
  access:
    anyOf:
    - - HeadOfPersonnel
  airtight: true
id: serving_clusters
name: Repeated serving clusters
description: Small complete V3 example. Repeat a functional parent without cross-binding its customer
  room to another instance.
domains: []
assemblies: []
extensions: []
spaces:
- id: service
  name: Service
  kind: department
  description: Service is made of functional clusters distributed along public circulation. Food production
    stays grouped; chapel, library and entertainment can occupy separate useful locations.
