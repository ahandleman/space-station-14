# Normal geometric station example; full catalog departments are tested separately.
format: ss14-station-architect
schemaVersion: 3
id: station_layout
name: Station layout example
description: 'Supported geometric fixture: one local serving suite, containment,
  secure access, maintenance and a real exterior berth. It does not request native
  machinery or runtime certification.'
defaults:
  requirement:
    priority: mandatory
    weight: 100
accessProfiles:
- id: public
  description: Uncredentialed crew.
  levels:
  - public
  canTraverseVacuum: false
- id: staff
  description: Fixture staff and maintenance access.
  levels:
  - public
  - Staff
  - Maintenance
  canTraverseVacuum: false
- id: maintenance
  description: Maintenance credential.
  levels:
  - public
  - Maintenance
  - Staff
  canTraverseVacuum: false
environments:
- id: habitable
  description: Sealed habitable planning environment.
  pressure: standard
  enclosure: sealed
  temperature: ambient
grids:
- id: station
  description: Main station grid.
  kind: station
  support: mixed
- id: visitor
  description: Visiting shuttle grid reservation.
  kind: detached
  support: solid
domains:
- id: exterior_space
  description: Exterior connected vacuum.
  kind: vacuum
  connectedToExterior: true
interfaces:
- id: public_open_edge
  description: Unobstructed edge between public floor zones; no wall, door or threshold tile.
  geometry: open_edge
  capabilities:
  - crew_passage
  - gas_transfer
  - visibility
  - speech
  construction: []
  normalState: open
  access:
    anyOf: []
  airtight: false
- id: public_door
  description: public door
  capabilities:
  - crew_passage
  - gas_transfer
  construction:
  - Airlock
  normalState: controlled
  access:
    anyOf: []
  airtight: true
- id: staff_door
  description: staff door
  capabilities:
  - crew_passage
  - gas_transfer
  construction:
  - Airlock
  normalState: controlled
  access:
    anyOf:
    - - Staff
  airtight: true
- id: maintenance_door
  description: maintenance door
  capabilities:
  - crew_passage
  - gas_transfer
  construction:
  - Airlock
  normalState: controlled
  access:
    anyOf:
    - - Maintenance
  airtight: true
- id: counter
  description: counter
  capabilities:
  - item_transfer
  - speech
  - visibility
  construction:
  - TableCounterMetal
  normalState: open
  access:
    anyOf: []
  airtight: false
- id: hop_window
  description: hop window
  capabilities:
  - item_transfer
  - speech
  - visibility
  construction:
  - WindoorHeadOfPersonnelLocked
  normalState: controlled
  access:
    anyOf:
    - - Staff
  airtight: true
- id: dock
  description: dock
  capabilities:
  - crew_passage
  - docking
  construction:
  - Airlock
  normalState: controlled
  access:
    anyOf: []
  airtight: true
assemblies: []
extensions: []
evidence:
- id: fixture_policy
  kind: policy
  source: GENERATOR_PLAN.md
  description: Geometric test fixture dimensions, not measured native shuttle defaults.
